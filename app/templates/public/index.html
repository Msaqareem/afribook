{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-xl text-center">
  <h1 class="text-3xl font-semibold tracking-tight">Appointment booking for Kenyan businesses</h1>
  <p class="mt-3 text-slate-600">Publish a booking page, take appointments and get paid by M-Pesa.</p>
  <div class="mt-6 flex justify-center gap-3">
    <a class="rounded-md bg-emerald-700 px-4 py-2 text-white hover:bg-emerald-800" href="{{ url_for('auth.register') }}">Get started</a>
    <a class="rounded-md border border-slate-300 px-4 py-2 hover:bg-slate-100" href="{{ url_for('auth.login') }}">Log in</a>
  </div>
</section>
{% endblock %}
